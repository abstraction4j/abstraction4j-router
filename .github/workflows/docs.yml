name: Docs

# Publishes the documentation of each release to GitHub Pages, in a folder of its own,
# once that release is on Maven Central. The Release workflow only uploads to the Central
# Portal; the release goes live when it's published there, and the Portal can't notify
# GitHub, so this also checks every hour. Published versions are kept on the gh-pages
# branch and are not rebuilt unless named in a manual run.
on:
  workflow_run:
    workflows: [ Release ]
    types: [ completed ]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Version to rebuild although its docs are already published (it must be on Maven Central)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  publish:
    name: Publish new versions
    runs-on: ubuntu-latest
    permissions:
      # Pushes the new version folders to gh-pages.
      contents: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags.
          fetch-depth: 0
      - name: Check out gh-pages
        run: |
          if git fetch origin gh-pages; then
            git worktree add -B gh-pages pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - id: publish
        run: .github/scripts/publish-docs.sh pages "$REBUILD"
        env:
          REBUILD: ${{ inputs.rebuild }}
      - name: Push gh-pages
        if: steps.publish.outputs.changed == 'true'
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Publish documentation"
          git push origin gh-pages

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    # Manual runs redeploy, for example after changing the Pages settings.
    if: needs.publish.outputs.published == 'true' && (needs.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
