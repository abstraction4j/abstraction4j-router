name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs; Dependabot keeps them up to date.
jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube needs the full history to attribute new code.
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Also validates the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build
      - name: Upload coverage report
        if: matrix.java == 21
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/reports/jacoco/testCodeCoverageReport/
      # Catches broken docs before a release; the Docs workflow publishes released versions.
      - name: Build documentation site
        if: matrix.java == 21
        run: ./gradlew site
      - name: Upload documentation site
        if: matrix.java == 21
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: build/site/
      # Skipped until the SONAR_TOKEN secret is added, and on pull requests from forks.
      - name: SonarQube Cloud analysis
        if: matrix.java == 21 && env.SONAR_TOKEN != ''
        run: ./gradlew sonar

  minimum-spring:
    name: Minimum Spring (Framework 7.0.1, Boot 4.0.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Keep in sync with the supported versions in README.adoc.
      - run: ./gradlew build -PspringFrameworkVersion=7.0.1 -PspringBootVersion=4.0.0

  native-image:
    name: GraalVM native image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: 25
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Builds the integration test as a native image and runs it; fails if a router misroutes.
      - run: ./gradlew :abstraction4j-router-it-native-image:nativeRun
